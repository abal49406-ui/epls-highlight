name: Update EPL YouTube Feeds

on:
  schedule:
    - cron: "*/20 * * * *"   # tiap 20 menit (waktu UTC). Ubah sesuai kebutuhan.
  workflow_dispatch: {}       # supaya bisa dijalankan manual dari tab "Actions" di GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch feeds
        run: node scripts/fetch-feeds.js

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --staged --quiet || git commit -m "Update video feeds [automated]"
          git push
